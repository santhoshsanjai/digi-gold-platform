name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create the non-superuser app role and databases
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -f ../../infra/postgres/init.sql
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m app.cli export-openapi openapi.json
          git diff --exit-code openapi.json || (echo "Run: uv run python -m app.cli export-openapi" && exit 1)

  web:
    # The CRM, the Platform Console and the components they share (packages/web-common).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: API types match the API schema
        working-directory: packages/web-common
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts || (echo "Run: npm run api:types -w @digigold/web-common" && exit 1)
      - name: Website API types match the API schema
        working-directory: apps/website
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts || (echo "Run: npm run api:types -w @digigold/website" && exit 1)
      - run: npm run lint
      - run: npm run typecheck -w @digigold/web-common
      - run: npm run build

  mobile:
    # The customer app has its own lockfile; it is not part of the npm workspaces.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: API types match the API schema
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts || (echo "Run: npm run api:types in apps/mobile" && exit 1)
      - run: npm run typecheck
      - run: npm run lint
